<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.12.1/font/bootstrap-icons.min.css">
    <link rel="icon" href="{% static 'img/site-pic.ico' %}" type="image/icon type" />
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
    <link href='https://cdn.boxicons.com/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <title>{% block title %}Weather{% endblock %}</title>

</head>

<body class="dark">
    <nav class="sidebar close">
        <header>
            <div class="image-text">
                <span class="image">
                    <img src="{% static 'img/logo.png' %}" alt="logo" />
                </span>
                <div class="text header-text">
                    <span class="name">UTE</span>
                    <span class="profession">Weather web</span>
                </div>
            </div>

            <i class='bx  bx-chevron-right toggle'></i>
        </header>

        <div class="menu-bar">
            <div class="menu">
                <ul class="menu-links">
                    <li class="nav-link">
                        <a href="{% url 'index' %}">
                            <i class='bx  bx-home-alt-2 icon'></i>
                            <span class="text nav-text">Home</span>
                        </a>
                    </li>
                    <li class="nav-link">
                        <a href="{% url 'weather' %}">
                            <i class='bx  bx-cloud icon'></i>
                            <span class="text nav-text">Weather</span>
                        </a>
                    </li>
                    <li class="nav-link">
                        <a href="{% url 'map' %}">
                            <i class='bx  bx-map icon'></i>
                            <span class="text nav-text">Map</span>
                        </a>
                    </li>
                    <li class="nav-link">
                        <a href="#" class="ajax-link" data-url="{% url 'dashboard' %}">
                            <i class='bx  bx-light-bulb-on icon'  ></i> 
                            <span class="text nav-text">Dashboard</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div class="bottom-content">
                <li class="mode">
                    <div class="moon-sun">
                        <i class='bx  bx-moon icon moon'></i>
                        <i class='bx  bx-sun icon sun'></i>
                    </div>
                    <span class="mode-text text">Dark Mode</span>

                    <div class="toggle-switch">
                        <span class="switch"></span>
                    </div>
                </li>
            </div>
        </div>
    </nav>
    <!-- <section class="home">
        <div class="text">Dashboard</div>
    </section> -->
    <section class="home" id="main-content">
        {% block content %}
        {% endblock %}
    </section>

    <script type="module" src="{% static 'js/script.js' %}"></script>
</body>
</html>
